<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="graph" aria-label="Knowledge graph"></canvas>
  <div class="dropzone" id="dropzone" hidden><div>Drop a screenshot, photo or PDF for JARVIS</div></div>

  <div id="banner" class="banner" hidden></div>

  <!-- LEFT: identity, stats, inspector, hubs -->
  <aside class="panel left">
    <header class="brand">
      <div class="wordmark">J.A.R.V.I.S</div>
      <span id="mode" class="badge">—</span>
    </header>
    <div class="stats" id="stats"></div>
    <div class="chips" id="chips"></div>

    <section class="inspector" id="inspector">
      <div class="label">Inspector</div>
      <div id="note" class="note empty">Click a node to open it.<br><span class="hint">Shift-click a second node to trace the path between them.</span></div>
    </section>

    <section class="hubs">
      <div class="label">Top hubs</div>
      <ol id="hubs"></ol>
    </section>
  </aside>

  <!-- RIGHT: reactor + filters -->
  <aside class="panel right">
    <div class="reactor" id="reactor" data-state="idle">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ec4899"/>
          </linearGradient>
          <radialGradient id="core"><stop offset="0" stop-color="#ffe4f5"/><stop offset=".45" stop-color="#ec4899"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
        </defs>
        <circle class="ring r1" cx="100" cy="100" r="88"/>
        <circle class="ring r2" cx="100" cy="100" r="72"/>
        <circle class="ring r3" cx="100" cy="100" r="56"/>
        <g class="ticks"></g>
        <circle class="core" cx="100" cy="100" r="30" fill="url(#core)"/>
      </svg>
      <div class="reactor-state" id="reactor-state">IDLE</div>
    </div>

    <section class="widgets">
      <div class="label">Widgets <button class="link" id="widgets-edit" title="Show, hide and reorder widgets">edit</button></div>
      <div id="widgets"></div>
    </section>

    <section class="filters">
      <div class="label">Filter <button class="link" id="show-all">all</button></div>
      <ul id="filters"></ul>
    </section>
  </aside>

  <!-- BOTTOM: ask bar -->
  <footer class="askbar">
    <div class="convo" id="convo" hidden>
      <div class="convo-head">
        <span>Conversation</span>
        <span><button class="link" id="new-chat" title="Forget the last 10 turns">new chat</button>
              <button class="link" id="hide-convo">hide</button></span>
      </div>
      <div id="convo-list"></div>
    </div>
    <div class="caption" id="caption" aria-live="polite"></div>
    <div class="tray" id="tray" hidden></div>
    <form id="ask" autocomplete="off">
      <div class="bars" id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <button type="button" class="btn ghost clip" id="clip" title="Attach a screenshot, photo or PDF (or paste / drop one)">📎</button>
      <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf" multiple hidden>
      <input id="q" type="text" placeholder="" aria-label="Ask JARVIS">
      <span class="badge warn" id="model-badge" hidden title="No model: replies come from keyword routing">NO MODEL</span>
      <button type="submit" class="btn primary" title="Send (Enter)">Ask</button>
    </form>
    <div class="actions">
      <button class="btn" id="wake" disabled>Hey Jarvis</button>
      <button class="btn" id="mic" disabled>Mic</button>
      <button class="btn" id="mute" disabled>Mute</button>
      <button class="btn" id="brief" title="Calendar, unread, what slipped">Brief</button>
      <button class="btn" id="plan" title="Five things, ordered by money">Plan</button>
      <button class="btn" id="market" title="Pre-session: Forex Factory calendar + NQ and markets">Market</button>
      <button class="btn" id="week" title="Your week: what moved, what slipped, what's next">Week</button>
      <button class="btn" id="memory" title="What JARVIS remembers about you">Memory</button>
      <button class="btn ghost" id="fit" title="Fit graph (F)">Fit</button>
    </div>
  </footer>

  <script src="vendor/ort.wasm.min.js"></script>
  <script src="wake.js"></script>
  <script src="graph.js"></script>
  <script src="app.js"></script>
</body>
</html>
